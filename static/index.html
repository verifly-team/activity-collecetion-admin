<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f1eb">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>66th 参展申请 · 导出后台</title>
<style>
  :root{
    /* —— 与 activity-66-portal 一致的设计变量 —— */
    --ink:#191917; --paper:#f3f1eb; --white:#ffffff;
    --muted:#696963; --line:#cac9c2; --line-soft:#e3e1da;
    --sage:#a5c0b5; --sage-deep:#4d6b60; --pink:#e6cada; --blue:#6190bf;
    --error:#a2372b; --error-soft:#f6e6e2;
    --display:"Futura","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
    --font:"OPPO Sans 4.0","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--white); color:var(--ink);
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  input,select{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* 统一的大写小标签 */
  .eyebrow{font-family:var(--display);font-size:9px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* ---------------- 登录 ---------------- */
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}
  .login-card{width:100%;max-width:420px;background:var(--white);
    border:1px solid var(--line);padding:44px 40px}
  .login-card .login-brand{height:64px;width:auto;display:block;margin-bottom:26px}
  .login-card h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;
    margin:0 0 8px}
  .login-card p{margin:0 0 28px;color:var(--muted);font-size:12px}

  /* ---------------- 顶栏 ---------------- */
  .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
  .topbar-in{max-width:1560px;margin:0 auto;padding:0 28px;height:76px;
    display:flex;align-items:center;gap:18px}
  .brand-bar{display:flex;align-items:center;gap:16px;text-decoration:none}
  .brand-bar img{height:42px;width:auto;display:block}
  .brand-tag{display:flex;flex-direction:column;gap:2px;padding-left:16px;
    border-left:1px solid var(--line);font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink)}
  .brand-tag em{font-family:var(--display);font-style:normal;font-weight:600;font-size:8.5px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;font-size:11px;
    font-weight:600;letter-spacing:.04em;border:1px solid var(--line);background:transparent;
    color:var(--muted);white-space:nowrap}
  .pill.accent{background:var(--paper);border-color:var(--paper);color:var(--ink)}
  .wrap{max-width:1560px;margin:0 auto;padding:28px 28px 150px}

  /* ---------------- 统计 ---------------- */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);margin-bottom:24px}
  .stat{background:var(--white);padding:22px 24px}
  .stat .k{font-family:var(--display);font-size:9px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.15;
    letter-spacing:-.02em;margin-top:6px}
  .stat .v small{font-family:var(--font);font-size:12px;font-weight:500;color:var(--muted);
    margin-left:5px;letter-spacing:0}

  /* ---------------- 筛选 ---------------- */
  .filters{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;
    padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-family:var(--display);font-size:9px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .input,select.input{height:38px;padding:0 2px;border:0;border-bottom:1px solid var(--line);
    background:transparent;outline:none;font-size:14px;transition:border-color 160ms ease,box-shadow 160ms ease}
  .input:hover{border-bottom-color:var(--ink)}
  .input:focus{border-bottom-color:var(--ink);box-shadow:inset 0 -1px 0 var(--ink)}
  .input::placeholder{color:#a3a29a}
  .date-range{display:flex;align-items:center;gap:10px}
  .date-range .input{width:148px}
  .date-sep{color:var(--muted);font-size:12px}
  .field--grow{flex:1;min-width:200px;max-width:280px}
  .field--grow .input{width:100%}
  .filter-actions{display:flex;gap:0;margin-left:auto}
  .filter-actions .btn + .btn{margin-left:-1px}
  .chips{display:flex;gap:0}
  .chip{min-height:38px;padding:8px 18px;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:13px;font-weight:500;margin-left:-1px;transition:all 160ms ease}
  .chip:first-child{margin-left:0}
  .chip:hover{border-color:var(--ink);z-index:1}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--white);z-index:2}

  .btn{min-height:38px;padding:0 18px;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;
    justify-content:center;gap:8px;transition:all 160ms ease}
  .btn:hover{border-color:var(--ink)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--white)}
  .btn.primary:hover{background:var(--sage-deep);border-color:var(--sage-deep)}
  .btn.block{width:100%;min-height:52px;font-size:14px}
  .btn:disabled{background:transparent;border-color:var(--line-soft);color:#b3b2ab;cursor:not-allowed}
  .btn.primary:disabled{background:#dcdad3;border-color:#dcdad3;color:#8b8a84}

  /* ---------------- 表格 ---------------- */
  .card{background:var(--white);border:1px solid var(--line);border-top:0}
  .table-scroll{overflow:auto;max-height:calc(100vh - 400px)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:1120px}
  thead th{position:sticky;top:0;z-index:5;background:var(--paper);text-align:left;
    font-family:var(--display);font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);padding:12px 14px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:hover{background:#faf9f5}
  tbody tr.sel{background:var(--paper)}
  tbody tr.sel td{border-bottom-color:var(--line)}
  tbody tr:last-child td{border-bottom:none}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  td.nowrap{white-space:nowrap}
  .muted{color:var(--muted)}
  .tag{display:inline-block;padding:3px 9px;border:1px solid var(--line);background:transparent;
    color:var(--ink);font-size:11px;font-weight:500;margin-right:4px;line-height:1.5}
  .tag.zone{background:var(--paper);border-color:transparent}
  .tag.none{border-color:transparent;color:#b3b2ab}
  .cb{width:15px;height:15px;accent-color:var(--ink);cursor:pointer;border-radius:0}
  .cb:disabled{cursor:not-allowed;opacity:.3}
  .empty{padding:72px 24px;text-align:center;color:var(--muted)}
  .empty h3{margin:0 0 6px;font-family:var(--display);font-size:13px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .loading{padding:56px;text-align:center;color:var(--muted)}
  .spin{width:16px;height:16px;border:1.5px solid var(--line);border-top-color:var(--ink);
    border-radius:50%;display:inline-block;animation:sp .7s linear infinite;
    vertical-align:-3px;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------------- 分页 ---------------- */
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;
    padding:14px 18px;border-top:1px solid var(--line);background:var(--white);font-size:12px}

  /* ---------------- 手机号 ---------------- */
  .phone-cell{white-space:nowrap}
  .phone-cell .eye{margin-left:8px;width:26px;height:26px;padding:0;border:0;background:transparent;
    color:var(--muted);display:inline-flex;align-items:center;justify-content:center;
    vertical-align:-7px;transition:color 160ms ease}
  .phone-cell .eye:hover{color:var(--ink)}
  .phone-cell .eye svg{display:block}
  .phone-cell.revealed .phone-text{font-weight:600}

  /* ---------------- 底部操作条 ---------------- */
  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);
    border-top:1px solid var(--line)}
  .actionbar-in{max-width:1560px;margin:0 auto;padding:16px 28px;display:flex;
    align-items:center;gap:18px}
  .selinfo{font-size:13px;color:var(--muted)}
  .selinfo b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);
    font-variant-numeric:tabular-nums;margin:0 2px}
  .selinfo .size{margin-left:18px;padding-left:18px;border-left:1px solid var(--line)}
  .selinfo .size b{font-size:14px}
  .warn{color:var(--error);font-size:11px;font-weight:600;margin-left:12px}

  /* ---------------- Toast ---------------- */
  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:100;
    display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:var(--white);padding:11px 22px;font-size:12px;
    font-weight:500;letter-spacing:.02em;animation:in .18s ease}
  .toast.err{background:var(--error)}
  .toast.ok{background:var(--sage-deep)}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  /* ---------------- 弹窗 ---------------- */
  .modal{position:fixed;inset:0;background:rgba(25,25,23,.45);z-index:90;display:grid;place-items:center;padding:20px}
  .modal-card{background:var(--white);padding:32px 34px;text-align:center;max-width:340px;
    border:1px solid var(--line)}
  .modal-card h3{margin:16px 0 6px;font-family:var(--display);font-size:15px;font-weight:700}
  .modal-card p{margin:0;color:var(--muted);font-size:12px}
  .modal-card.confirm{max-width:460px;text-align:left;padding:28px 30px}
  .confirm-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .confirm-head h3{margin:0;font-family:var(--display);font-size:16px;font-weight:700}
  .warn-dot{width:28px;height:28px;background:var(--error-soft);color:var(--error);
    display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
  .confirm-body{font-size:13px;color:var(--muted);line-height:1.75}
  .confirm-body b{color:var(--ink)}
  .confirm-stat{display:flex;gap:0;border:1px solid var(--line);margin-bottom:16px}
  .confirm-stat > div{flex:1;padding:12px 16px;border-right:1px solid var(--line)}
  .confirm-stat > div:last-child{border-right:0}
  .confirm-stat span{font-family:var(--display);font-size:9px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);display:block}
  .confirm-stat strong{display:block;font-family:var(--display);font-size:19px;font-weight:700;
    color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px}
  .confirm-warn{background:var(--paper);padding:12px 16px;color:var(--ink);font-size:12.5px;line-height:1.7}
  .confirm-warn b{font-weight:600}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

  .hidden{display:none !important}
  @media(max-width:900px){
    .stats{grid-template-columns:1fr}
    .actionbar-in{flex-wrap:wrap}
    .wrap{padding:18px 16px 190px}
    .topbar-in{padding:0 16px}
  }
  </style>
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="loginView" class="login-wrap">
  <form class="login-card" id="loginForm">
    <img class="login-brand" src="/brand.png" alt="66th &amp; 2nd Ave.">
    <h1 id="loginTitle">参展申请导出后台</h1>
    <p>请输入访问令牌（由管理员提供）</p>
    <input class="input block" id="tokenInput" type="password" placeholder="Export Token"
           autocomplete="current-password" style="width:100%;height:44px;margin-bottom:14px">
    <button class="btn primary block" type="submit" id="loginBtn">进入</button>
    <p id="loginErr" class="hidden" style="color:var(--danger);margin-top:14px;font-size:13px"></p>
  </form>
</div>

<!-- ============ 主界面 ============ -->
<div id="appView" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <a class="brand-bar" href="/" aria-label="66th &amp; 2nd Ave. Vintage Fashion Market">
        <img src="/brand.png" alt="66th &amp; 2nd Ave. Vintage Fashion Market">
        <span class="brand-tag">导出后台<em>Export Console</em></span>
      </a>
      <div class="spacer"></div>
      <span class="pill accent" id="limitPill">单次最多 10 条</span>
      <button class="btn" id="logoutBtn">退出</button>
    </div>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="stat"><div class="k">报名总数</div><div class="v" id="statTotal">–</div></div>
      <div class="stat"><div class="k">附件数量</div><div class="v" id="statFiles">–</div></div>
      <div class="stat"><div class="k">附件总体积</div><div class="v" id="statSize">–<small>MB</small></div></div>
    </div>

    <div class="filters">
      <div class="field">
        <label>提交时间</label>
        <div class="date-range">
          <input class="input" type="date" id="fFrom">
          <span class="date-sep">至</span>
          <input class="input" type="date" id="fTo">
        </div>
      </div>
      <div class="field">
        <label>区域</label>
        <div class="chips" id="zoneChips">
          <button type="button" class="chip on" data-zone="">全部</button>
          <button type="button" class="chip" data-zone="A">A 区</button>
          <button type="button" class="chip" data-zone="B">B 区</button>
          <button type="button" class="chip" data-zone="C">C 区</button>
        </div>
      </div>
      <div class="field field--grow">
        <label>关键词</label>
        <input class="input" id="fKeyword" placeholder="品牌 / 联系人 / 手机">
      </div>
      <div class="filter-actions">
        <button class="btn primary" id="searchBtn">查询</button>
        <button class="btn" id="resetBtn">重置</button>
      </div>
    </div>

    <div class="card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:40px"><input type="checkbox" class="cb" id="checkAll" title="全选本页"></th>
              <th style="width:64px">ID</th>
              <th style="width:150px">提交时间</th>
              <th>品牌 / 店铺</th>
              <th style="width:100px">联系人</th>
              <th style="width:130px">手机</th>
              <th style="width:90px">城市</th>
              <th style="width:110px">意向区域</th>
              <th style="width:150px">经营品类</th>
              <th style="width:80px">带货件数</th>
              <th style="width:120px">附件</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pager">
        <span class="muted" id="pageInfo">–</span>
        <div class="spacer"></div>
        <button class="btn" id="prevBtn" style="height:32px">上一页</button>
        <button class="btn" id="nextBtn" style="height:32px">下一页</button>
      </div>
    </div>
  </div>

  <div class="actionbar">
    <div class="actionbar-in">
      <div class="selinfo">
        已选 <b id="selCount">0</b> / <span id="selLimit">10</span> 条
        <span class="size">合计 <b id="selSize">0 MB</b></span>
        <span class="warn hidden" id="limitWarn">已达单次上限，请先取消勾选</span>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="xlsxBtn" disabled>导出 Excel</button>
      <button class="btn primary" id="zipBtn" disabled>打包下载 ZIP（含附件）</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<div id="confirmModal" class="modal hidden">
  <div class="modal-card confirm">
    <div class="confirm-head">
      <span class="warn-dot">!</span>
      <h3 id="confirmTitle">确认导出？</h3>
    </div>
    <div id="confirmBody" class="confirm-body"></div>
    <div class="confirm-actions">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn primary" id="confirmOk">确认导出</button>
    </div>
  </div>
</div>

<div id="packing" class="modal hidden">
  <div class="modal-card">
    <div class="spin" style="width:26px;height:26px;border-width:3px"></div>
    <h3>正在打包…</h3>
    <p id="packingTip">文件较大时需要几十秒，请勿关闭页面</p>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const state = {
    token: sessionStorage.getItem('export_token') || '',
    items: [], selected: new Map(),
    page: 1, pages: 1, total: 0,
    limit: 10, maxMb: 300,
    zone: '', keyword: '', from: '', to: '',
  };

  const fmtMB = (b) => {
    if (!b) return '0 MB';
    if (b >= 1024 * 1024 * 1024) return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    if (b >= 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
    if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
    return b + ' B';
  };
  const fmtTime = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  // 眼睛图标：睁眼 = 未展开（点击后展开），闭眼 = 已展开（点击后收起）
  const EYE = {
    off: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 12S5.6 5.5 12 5.5 22.2 12 22.2 12 18.4 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>',
    on: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.8A9.9 9.9 0 0 1 12 5.5c6.4 0 10.2 6.5 10.2 6.5a17.9 17.9 0 0 1-3.3 4.1"/><path d="M6.2 7.1A17.6 17.6 0 0 0 1.8 12S5.6 18.5 12 18.5a9.9 9.9 0 0 0 4.1-.9"/><path d="M10 10a2.9 2.9 0 0 0 4.1 4.1"/><path d="M3 3l18 18"/></svg>',
  };

  // 手机号脱敏：138****8000
  const maskPhone = (p) => {
    const v = String(p || '');
    if (!v) return '—';
    if (v.length >= 11) return v.slice(0, 3) + '****' + v.slice(-4);
    if (v.length >= 7) return v.slice(0, 2) + '****' + v.slice(-2);
    return v.slice(0, 1) + '***';
  };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  async function api(path, opts) {
    opts = opts || {};
    const res = await fetch(path, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + state.token, ...(opts.headers || {}) },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (body.error && body.error.message) || ('HTTP ' + res.status);
      const err = new Error(msg);
      err.code = body.error && body.error.code;
      if (res.status === 401) logout();
      throw err;
    }
    return body;
  }

  /* ---------------- 登录 ---------------- */
  async function login(token) {
    const res = await fetch('/api/v1/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((body.error && body.error.message) || '登录失败');
    state.token = token;
    sessionStorage.setItem('export_token', token);
    if (body.limits) applyLimits(body.limits);
    if (body.site_title) document.title = body.site_title;
    showApp();
  }

  function applyLimits(l) {
    state.limit = l.max_records ?? state.limit;
    state.maxMb = l.max_mb ?? state.maxMb;
    $('limitPill').textContent = `单次最多 ${state.limit} 条 · ${state.maxMb} MB`;
    $('selLimit').textContent = state.limit;
  }

  function logout() {
    state.token = '';
    sessionStorage.removeItem('export_token');
    state.selected.clear();
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
  }

  function showApp() {
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    loadSummary();
    loadList();
  }

  /* ---------------- 数据 ---------------- */
  async function loadSummary() {
    try {
      const s = await api('/api/v1/summary');
      $('statTotal').textContent = s.applications;
      $('statFiles').textContent = s.files;
      $('statSize').innerHTML = fmtMB(s.bytes).replace(/([A-Z]+)$/, '<small>$1</small>');
      if (s.limits) applyLimits(s.limits);
    } catch (e) { /* 静默 */ }
  }

  async function loadList() {
    $('tbody').innerHTML = '<tr><td colspan="11" class="loading"><span class="spin"></span>加载中…</td></tr>';
    const q = new URLSearchParams({ page: state.page });
    if (state.keyword) q.set('keyword', state.keyword);
    if (state.zone) q.set('zone', state.zone);
    if (state.from) q.set('date_from', state.from);
    if (state.to) q.set('date_to', state.to);

    try {
      const data = await api('/api/v1/applications?' + q.toString());
      state.items = data.items;
      state.pages = data.pages;
      state.total = data.total;
      renderTable();
    } catch (e) {
      $('tbody').innerHTML = `<tr><td colspan="11" class="empty"><h3>加载失败</h3>${esc(e.message)}</td></tr>`;
    }
  }

  function renderTable() {
    const tb = $('tbody');
    if (!state.items.length) {
      tb.innerHTML = '<tr><td colspan="11" class="empty"><h3>没有符合条件的报名</h3>换个筛选条件试试</td></tr>';
    } else {
      tb.innerHTML = state.items.map((it) => {
        const zones = (it.zones || []).map((z) => `<span class="tag zone">${esc(z)} 区</span>`).join('');
        const cats = (it.categories || []).map((c) => `<span class="tag">${esc(catName(c))}</span>`).join('');
        const files = it.file_count
          ? `<span class="mono">${it.file_count} 个 · ${fmtMB(it.file_size)}</span>`
          : '<span class="tag none">无附件</span>';
        const on = state.selected.has(it.id);
        return `<tr class="${on ? 'sel' : ''}" data-id="${it.id}">
          <td><input type="checkbox" class="cb row-cb" data-id="${it.id}" ${on ? 'checked' : ''}></td>
          <td class="mono muted">${it.id}</td>
          <td class="mono">${fmtTime(it.created_at)}</td>
          <td><strong>${esc(it.brand_name)}</strong></td>
          <td>${esc(it.contact_name || '—')}</td>
          <td class="mono phone-cell" data-phone="${esc(it.phone || '')}">
            <span class="phone-text">${esc(maskPhone(it.phone))}</span>
            ${it.phone ? `<button type="button" class="eye" title="显示号码" aria-label="显示号码">${EYE.off}</button>` : ''}
          </td>
          <td>${esc(it.city || '—')}</td>
          <td>${zones || '—'}</td>
          <td>${cats || '—'}</td>
          <td class="mono">${it.expected_qty ?? '—'}</td>
          <td class="nowrap">${files}</td>
        </tr>`;
      }).join('');
      tb.querySelectorAll('.row-cb').forEach((cb) => {
        cb.addEventListener('change', () => toggle(Number(cb.dataset.id), cb.checked));
      });
      tb.querySelectorAll('.eye').forEach((btn) => {
        btn.addEventListener('click', () => {
          const cell = btn.closest('.phone-cell');
          const text = cell.querySelector('.phone-text');
          const full = cell.dataset.phone;
          const shown = btn.dataset.shown === '1';
          text.textContent = shown ? maskPhone(full) : full;
          btn.dataset.shown = shown ? '0' : '1';
          btn.innerHTML = shown ? EYE.off : EYE.on;
          btn.title = shown ? '显示号码' : '隐藏号码';
          btn.setAttribute('aria-label', btn.title);
          cell.classList.toggle('revealed', !shown);
        });
      });
    }
    $('pageInfo').textContent = `第 ${state.page} / ${state.pages} 页 · 共 ${state.total} 条`;
    $('prevBtn').disabled = state.page <= 1;
    $('nextBtn').disabled = state.page >= state.pages;
    syncSelectionUI();
  }

  const CAT = { bag: '箱包', watch: '腕表', jewelry: '珠宝', apparel: '服饰', shoe: '鞋履', other: '其他' };
  function catName(c) { return CAT[c] || c; }

  /* ---------------- 选择 ---------------- */
  function toggle(id, on) {
    if (on) {
      if (state.selected.size >= state.limit) {
        toast(`单次最多选 ${state.limit} 条，请先取消其他勾选`, 'err');
        syncSelectionUI();
        return;
      }
      const item = state.items.find((x) => x.id === id);
      if (item) state.selected.set(id, item);
    } else {
      state.selected.delete(id);
    }
    const row = document.querySelector(`tr[data-id="${id}"]`);
    if (row) row.classList.toggle('sel', on);
    syncSelectionUI();
  }

  function syncSelectionUI() {
    const n = state.selected.size;
    let bytes = 0;
    state.selected.forEach((it) => { bytes += it.file_size || 0; });

    $('selCount').textContent = n;
    $('selSize').textContent = fmtMB(bytes);
    $('xlsxBtn').disabled = n === 0;
    const tooBig = bytes > state.maxMb * 1024 * 1024;
    $('zipBtn').disabled = n === 0 || tooBig;
    $('limitWarn').classList.toggle('hidden', n < state.limit);
    if (tooBig) toast(`附件合计 ${fmtMB(bytes)} 超过 ${state.maxMb}MB 上限`, 'err');

    const atLimit = n >= state.limit;
    document.querySelectorAll('.row-cb').forEach((cb) => {
      const id = Number(cb.dataset.id);
      cb.disabled = atLimit && !state.selected.has(id);
    });
    const all = state.items.length > 0 && state.items.every((it) => state.selected.has(it.id));
    $('checkAll').checked = all;
  }

  /* ---------------- 导出 ---------------- */
  function downloadUrl(path) {
    const ids = [...state.selected.keys()].join(',');
    return `${path}?ids=${encodeURIComponent(ids)}&token=${encodeURIComponent(state.token)}`;
  }

  function triggerDownload(path) {
    const a = document.createElement('a');
    a.href = downloadUrl(path);
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 1000);
  }

  function packing(on) { $('packing').classList.toggle('hidden', !on); }

  function selectionStats() {
    const n = state.selected.size;
    let bytes = 0;
    state.selected.forEach((it) => { bytes += it.file_size || 0; });
    let files = 0;
    state.selected.forEach((it) => { files += it.file_count || 0; });
    return { n, bytes, files };
  }

  // 导出前的二次确认
  function askConfirm(title, bodyHtml) {
    return new Promise((resolve) => {
      $('confirmTitle').textContent = title;
      $('confirmBody').innerHTML = bodyHtml;
      $('confirmModal').classList.remove('hidden');

      const finish = (ok) => {
        $('confirmModal').classList.add('hidden');
        $('confirmOk').removeEventListener('click', onOk);
        $('confirmCancel').removeEventListener('click', onCancel);
        $('confirmModal').removeEventListener('click', onBackdrop);
        document.removeEventListener('keydown', onEsc);
        resolve(ok);
      };
      const onOk = () => finish(true);
      const onCancel = () => finish(false);
      const onBackdrop = (e) => { if (e.target === $('confirmModal')) finish(false); };
      const onEsc = (e) => { if (e.key === 'Escape') finish(false); };

      $('confirmOk').addEventListener('click', onOk);
      $('confirmCancel').addEventListener('click', onCancel);
      $('confirmModal').addEventListener('click', onBackdrop);
      document.addEventListener('keydown', onEsc);
    });
  }

  function confirmBody(kind) {
    const { n, bytes, files } = selectionStats();
    const size = fmtMB(bytes);
    const detail =
      kind === 'zip'
        ? `将打包 <b>${files}</b> 个附件（合计 <b>${size}</b>），文件较大，下载可能需要一段时间。`
        : `仅导出表格（约几十 KB），不含附件原件。`;
    return `
      <div class="confirm-stat">
        <div><span>已选报名</span><strong>${n} 条</strong></div>
        <div><span>附件数量</span><strong>${files} 个</strong></div>
        <div><span>附件体积</span><strong>${size}</strong></div>
      </div>
      <p style="margin:0 0 12px">${detail}</p>
      <div class="confirm-warn">
        导出会实时读取<b>线上数据库与附件目录</b>，占用服务器磁盘与带宽，
        <b>可能影响线上报名页面的响应速度</b>。请谨慎操作，建议避开活动高峰时段。
      </div>`;
  }

  /* ---------------- 事件 ---------------- */
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('loginBtn');
    btn.disabled = true; btn.textContent = '验证中…';
    $('loginErr').classList.add('hidden');
    try {
      await login($('tokenInput').value.trim());
    } catch (err) {
      $('loginErr').textContent = err.message;
      $('loginErr').classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = '进入';
    }
  });

  $('logoutBtn').addEventListener('click', logout);

  $('zoneChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#zoneChips .chip').forEach((c) => c.classList.remove('on'));
    chip.classList.add('on');
    state.zone = chip.dataset.zone;
    state.page = 1;
    loadList();
  });

  $('searchBtn').addEventListener('click', () => {
    state.keyword = $('fKeyword').value.trim();
    state.from = $('fFrom').value;
    state.to = $('fTo').value;
    state.page = 1;
    loadList();
  });

  $('resetBtn').addEventListener('click', () => {
    $('fKeyword').value = ''; $('fFrom').value = ''; $('fTo').value = '';
    state.keyword = ''; state.from = ''; state.to = ''; state.zone = '';
    document.querySelectorAll('#zoneChips .chip').forEach((c, i) => c.classList.toggle('on', i === 0));
    state.page = 1;
    loadList();
  });

  $('fKeyword').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('searchBtn').click(); });

  $('checkAll').addEventListener('change', (e) => {
    const on = e.target.checked;
    if (on) {
      for (const it of state.items) {
        if (state.selected.size >= state.limit) break;
        if (!state.selected.has(it.id)) state.selected.set(it.id, it);
      }
      if (state.items.length + state.selected.size > state.limit) {
        toast(`已选满 ${state.limit} 条，其余未勾选`, '');
      }
      renderTable();
    } else {
      state.items.forEach((it) => state.selected.delete(it.id));
      renderTable();
    }
  });

  $('prevBtn').addEventListener('click', () => { if (state.page > 1) { state.page--; loadList(); } });
  $('nextBtn').addEventListener('click', () => { if (state.page < state.pages) { state.page++; loadList(); } });

  $('xlsxBtn').addEventListener('click', async () => {
    const ok = await askConfirm('确认导出 Excel？', confirmBody('xlsx'));
    if (!ok) return;
    triggerDownload('/api/v1/applications.xlsx');
    toast('开始下载 Excel', 'ok');
  });

  $('zipBtn').addEventListener('click', async () => {
    const ok = await askConfirm('确认打包下载？', confirmBody('zip'));
    if (!ok) return;
    packing(true);
    triggerDownload('/api/v1/bundle.zip');
    setTimeout(() => { packing(false); toast('已开始下载，请查看浏览器下载栏', 'ok'); }, 1500);
  });

  /* ---------------- 启动 ---------------- */
  // 支持 ?token=xxx 直接进入（方便下发链接），进入后把 token 从地址栏抹掉
  const urlToken = new URLSearchParams(location.search).get('token');
  if (urlToken) {
    login(urlToken)
      .then(() => history.replaceState(null, '', location.pathname))
      .catch(() => logout());
  } else if (state.token) {
    login(state.token).catch(() => logout());
  }
})();
</script>
</body>
</html>
