[project]
name = "activity-66-export"
version = "1.1.0"
description = "66th 参展申请 —— 导出后台（只读）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "PyMySQL>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF100", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
