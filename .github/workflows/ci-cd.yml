name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过测试"
        type: boolean
        default: false
      deploy:
        description: "构建成功后部署到服务器（第一次建议取消勾选，先验证构建）"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ secrets.ACR_REPO }}

jobs:
  # ---------------------------------------------------------------- 1. 测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 环境信息
        run: |
          python --version
          pip --version
          echo "--- 工作目录 ---"
          pwd && ls -1

      - name: 安装依赖（含测试依赖）
        run: pip install -r requirements-dev.txt

      - name: 依赖清单
        run: pip freeze

      - name: 代码风格
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: 单元测试
        run: pytest -q

  # ---------------------------------------------------------------- 2. 构建推送
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: 生成镜像标签
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 检查 Secrets 是否就位
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPO: ${{ secrets.ACR_REPO }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "ACR_REGISTRY  长度=${#ACR_REGISTRY}  值=$ACR_REGISTRY"
          echo "ACR_NAMESPACE 长度=${#ACR_NAMESPACE} 值=$ACR_NAMESPACE"
          echo "ACR_REPO      长度=${#ACR_REPO}      值=$ACR_REPO"
          echo "ACR_USERNAME  长度=${#ACR_USERNAME}  （值不打印）"
          echo "ACR_PASSWORD  长度=${#ACR_PASSWORD}  （值不打印）"
          miss=0
          for v in ACR_REGISTRY ACR_NAMESPACE ACR_REPO ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 Secret: $v"
              miss=1
            fi
          done
          if [ "$miss" = "1" ]; then
            echo ""
            echo "排查顺序："
            echo "1. Settings → Secrets and variables → Actions → 【Repository secrets】"
            echo "   （注意不是 Environments 里的，build job 没有 environment，读不到环境级 Secret）"
            echo "2. 检查名字是否完全一致，大小写敏感"
            echo "3. ACR 密码必须是控制台「访问凭证」里设的固定密码，不是阿里云登录密码"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ---------------------------------------------------------------- 3. 部署
  deploy:
    name: 部署到阿里云
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    # GitHub → Settings → Environments 里建的环境名，必须完全一致
    environment: acr
    steps:
      - uses: actions/checkout@v5

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 上传部署脚本
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.SSH_PORT || 22 }}" \
            deploy/remote-deploy.sh \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/verifly/activity-export/remote-deploy.sh"

      - name: 执行部署
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod +x /verifly/activity-export/remote-deploy.sh && \
             /verifly/activity-export/remote-deploy.sh \
               '${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}'"

      - name: 部署结果
        if: always()
        run: |
          echo "镜像：${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}"
          echo "提交：${{ github.sha }}"
