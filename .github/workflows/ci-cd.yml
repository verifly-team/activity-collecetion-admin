name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "跳过测试"
        type: boolean
        default: false
      deploy:
        description: "构建成功后部署到服务器（第一次建议取消勾选，先验证构建）"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 仓库地址不是机密，直接写在这里 —— 这样日志里能看到完整镜像名，排查方便
  # 换仓库时改这三行即可
  ACR_REGISTRY: crpi-quxtxo1i28qk1e0c.cn-guangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: arceus
  ACR_REPO: activity-66-export
  IMAGE_NAME: crpi-quxtxo1i28qk1e0c.cn-guangzhou.personal.cr.aliyuncs.com/arceus/activity-66-export

jobs:
  # ---------------------------------------------------------------- 1. 测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 环境信息
        run: |
          python --version
          pip --version
          echo "--- 工作目录 ---"
          pwd && ls -1

      - name: 安装依赖（含测试依赖）
        run: pip install -r requirements-dev.txt

      - name: 依赖清单
        run: pip freeze

      - name: 代码风格
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: 单元测试
        run: pytest -q

  # ---------------------------------------------------------------- 2. 构建推送
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 生成镜像标签
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: 检查配置与 Secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "目标镜像：$IMAGE_NAME"
          echo "登录用户：长度=${#ACR_USERNAME}"
          echo "登录密码：长度=${#ACR_PASSWORD}"
          miss=0
          for v in ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少 Secret: $v"
              miss=1
            fi
          done
          if [ "$miss" = "1" ]; then
            echo "去 Settings → Secrets and variables → Actions（Repository secrets）配置"
            exit 1
          fi

      # 不用 buildx / build-push-action：
      # 阿里云 ACR 个人版不认 BuildKit 的 OCI 证明清单，
      # 经典 docker build + docker push 推的是最普通的 V2 清单，兼容性最好。
      - name: 构建镜像
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          echo "镜像标签：$TAG"
          [ -n "$TAG" ] || { echo "::error::镜像标签为空"; exit 1; }
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_NAME:$TAG" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: 推送镜像
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          echo "推送目标：$IMAGE_NAME:$TAG"
          if ! docker push "$IMAGE_NAME:$TAG"; then
            echo ""
            echo "::error::推送被拒绝（denied）—— 按下面顺序排查："
            echo "1. ACR 控制台里【命名空间】是否叫 $ACR_NAMESPACE"
            echo "2. 该命名空间下是否已【创建仓库】$ACR_REPO（个人版必须先建仓库）"
            echo "3. 登录账号是否是命名空间所有者，或 RAM 用户有推送权限"
            echo "4. 仓库类型（私有/公开）与账号是否匹配"
            exit 1
          fi
          docker push "$IMAGE_NAME:latest"

      - name: 校验镜像确实在仓库里
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if docker manifest inspect "$IMAGE_NAME:$TAG" > /dev/null 2>&1; then
            echo "✅ 镜像已推送：$IMAGE_NAME:$TAG"
          else
            echo "::error::镜像没有推上去"
            exit 1
          fi

  # ---------------------------------------------------------------- 3. 部署
  deploy:
    name: 部署到阿里云
    runs-on: ubuntu-latest
    needs: build
    # push 默认只构建不部署；在仓库 Variables 里设 AUTO_DEPLOY=true 才自动部署
    if: ${{ (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true') || inputs.deploy }}
    # GitHub → Settings → Environments 里建的环境名，必须完全一致
    environment: acr
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          # tr -d '\r' 去掉 Windows 换行；printf 保证结尾有换行
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || echo "::warning::ssh-keyscan 失败，改用 accept-new"

      - name: 上传部署脚本
        run: |
          SSH_OPTS="-i ~/.ssh/id_deploy -p ${{ secrets.SSH_PORT || 22 }} -o StrictHostKeyChecking=accept-new"
          TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh $SSH_OPTS "$TARGET" 'mkdir -p /verifly/activity-export'
          scp -i ~/.ssh/id_deploy -P "${{ secrets.SSH_PORT || 22 }}" -o StrictHostKeyChecking=accept-new \
            deploy/remote-deploy.sh \
            "$TARGET:/verifly/activity-export/remote-deploy.sh"

      - name: 执行部署
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "chmod +x /verifly/activity-export/remote-deploy.sh && \
             /verifly/activity-export/remote-deploy.sh \
               '${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}'"

      - name: 部署结果
        if: always()
        run: |
          echo "镜像：${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}"
          echo "提交：${{ github.sha }}"
